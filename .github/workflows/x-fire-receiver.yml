name: x-fire-receiver
on:
  repository_dispatch:
    types: [x-fire]
permissions:
  contents: write
jobs:
  receive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: teleport-receive (payload落回执链,含FS挑战)
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - <<'PYEOF'
          import json,os,datetime,hashlib
          pl=json.loads(os.environ.get('PAYLOAD','{}') or '{}')
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          rec={'ts':ts,'payload':pl,'challenge':hashlib.sha256((json.dumps(pl,sort_keys=True)+ts).encode()).hexdigest()[:16]}
          import os as o
          o.makedirs('bridge/x-fire',exist_ok=True)
          fn='bridge/x-fire/'+ts.replace(':','').replace('-','')+'.json'
          open(fn,'w').write(json.dumps(rec,ensure_ascii=False,indent=1))
          print(json.dumps(rec,ensure_ascii=False)[:200])
          import subprocess
          subprocess.run(['git','config','user.name','xfire-receiver'],check=True)
          subprocess.run(['git','config','user.email','xfire@ci-root.local'],check=True)
          subprocess.run(['git','add',fn],check=True)
          subprocess.run(['git','commit','-m','x-fire receipt '+ts,'-q'],check=False)
          for i in range(3):
              r1=subprocess.run(['git','pull','--rebase','-q','origin','main'],check=False)
              r2=subprocess.run(['git','push','-q'],check=False)
              if r2.returncode==0: break
          PYEOF
